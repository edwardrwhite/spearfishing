  .row{display:flex;align-items:flex-end;justify-content:space-between;}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px;}
  @media(min-width:520px){.grid{grid-template-columns:repeat(3,1fr);}}
  .tile{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:12px;}
  .tile .v{font-family:var(--mono);font-size:26px;color:var(--bone);font-weight:600;}
  .tile .u{font-family:var(--mono);font-size:12px;color:var(--slate);margin-left:4px;}
  .tile .s{font-size:12px;color:var(--slate);margin-top:2px;}
  .pulse{animation:p 1.4s ease-in-out infinite;} @keyframes p{0%,100%{opacity:1}50%{opacity:.4}}
  .spot{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:12px;margin-top:12px;}
  .spot .h{font-family:var(--mono);font-size:14px;font-weight:700;}
  .spot .d{font-family:var(--mono);font-size:11px;color:var(--slate);}
  .spot .n{font-size:13px;color:var(--slate);line-height:1.5;margin-top:4px;}
  .legend{display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:center;margin-top:12px;}
  .legend span{font-family:var(--mono);font-size:10px;}
  .disc{font-size:11px;color:var(--slate);line-height:1.45;text-align:center;margin-top:8px;}
  #map{position:relative;overflow:hidden;border-radius:8px;height:460px;margin-top:12px;
    touch-action:none;cursor:grab;background:#0C2225;user-select:none;}
  #map img{position:absolute;width:256px;height:256px;user-select:none;-webkit-user-drag:none;}
  #ovl{position:absolute;left:0;top:0;pointer-events:none;}
  .mctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;}
  .mctl button{width:34px;height:34px;background:rgba(10,29,32,.82);border:1px solid var(--edge);
    color:var(--bone);font-family:var(--mono);font-size:17px;border-radius:6px;cursor:pointer;}
  #lbl{position:absolute;left:8px;top:8px;height:30px;padding:0 10px;background:rgba(10,29,32,.82);
    border:1px solid var(--edge);font-family:var(--mono);font-size:10px;letter-spacing:.08em;border-radius:6px;cursor:pointer;color:var(--seaglass);}
  #badge{position:absolute;left:8px;bottom:8px;background:rgba(10,29,32,.85);border:1px solid var(--edge);
    color:var(--amber);font-family:var(--mono);font-size:10px;padding:5px 8px;border-radius:6px;display:none;}
  .foot{font-family:var(--mono);font-size:10px;color:var(--slate);letter-spacing:.1em;line-height:1.8;text-align:center;margin-top:24px;}
</style>
</head>

function computeSunTimes(date, lat, lon) {
  const rad = Math.PI / 180;
  const start = new Date(date.getFullYear(), 0, 0);
  const doy = Math.floor((date - start) / 86400000);
  const lngHour = lon / 15;
  const calc = (rising) => {
    const t = doy + ((rising ? 6 : 18) - lngHour) / 24;
    const M = 0.9856 * t - 3.289;
    let L = M + 1.916 * Math.sin(M * rad) + 0.020 * Math.sin(2 * M * rad) + 282.634;
    L = ((L % 360) + 360) % 360;
    let RA = Math.atan(0.91764 * Math.tan(L * rad)) / rad;
    RA = ((RA % 360) + 360) % 360;
    RA += Math.floor(L / 90) * 90 - Math.floor(RA / 90) * 90;
    RA /= 15;
    const sinDec = 0.39782 * Math.sin(L * rad);
    const cosDec = Math.cos(Math.asin(sinDec));
    const cosH = (Math.cos(90.833 * rad) - sinDec * Math.sin(lat * rad)) / (cosDec * Math.cos(lat * rad));
    if (cosH > 1 || cosH < -1) return null;
    const H = (rising ? 360 - Math.acos(cosH) / rad : Math.acos(cosH) / rad) / 15;
    const T = H + RA - 0.06571 * t - 6.622;
    const UT = ((T - lngHour) % 24 + 24) % 24;
    const evt = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) + UT * 3600000);
    return evt.getHours() * 60 + evt.getMinutes();
  };
  const toHHMM = (m) => (m == null ? null : `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`);
  return { sunrise: toHHMM(calc(true)), sunset: toHHMM(calc(false)) };
}

  var grid=el("div",{class:"grid"});
  grid.appendChild(tile("Visibility est.",vis.lowFt!=null?vis.lowFt+"\u2013"+(vis.highFt==null?"?":vis.highFt):null,"ft",vis.note,pending));
  grid.appendChild(tile("Swell",d.swell?d.swell.heightFt:null,"ft",d.swell?((d.swell.periodS==null?"?":d.swell.periodS)+"s \u00b7 "+(d.swell.direction||"")):null,pending));
  grid.appendChild(tile("Wind",d.wind?d.wind.speedKt:null,"kt",d.wind?d.wind.direction:null,pending));
  grid.appendChild(tile("Water temp",d.waterTempF,"\u00b0F",d.waterTempF!=null?(d.waterTempF>=66?"Yellowtail water":d.waterTempF>=62?"5mm comfortable":"Cold \u2014 full kit"):null,pending));
  grid.appendChild(tile("First light",srM!=null?fmtMins(srM):null,null,"sunrise",false));
  grid.appendChild(tile("Last light",ssM!=null?fmtMins(ssM):null,null,"sunset",false));
  root.appendChild(grid);

  /* dive windows */
  var wins=today.filter(function(e){return srM!=null&&ssM!=null&&e.m>srM-30&&e.m<ssM+30;}).map(function(e){return {from:e.m-60,to:e.m+60,label:e.type==="H"?"High slack":"Low slack",past:e.m+60<nowM,best:e.type==="H"};});
  if(wins.length){var wc=el("div",{class:"card"});wc.appendChild(el("div",{class:"eyebrow"},"Dive windows \u00b7 slack tide in daylight"));var wl=el("div",{style:"display:flex;flex-direction:column;gap:6px;margin-top:8px;"});
    wins.forEach(function(w){var row=el("div",{style:"display:flex;align-items:center;gap:12px;"+(w.past?"opacity:.45;":"")});row.appendChild(el("span",{style:"font-family:"+MONO+";font-size:13px;color:"+C.bone+";min-width:118px;"},fmtMins(w.from)+"\u2013"+fmtMins(w.to)));
      row.appendChild(el("span",{style:"font-family:"+MONO+";font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:"+(w.best?C.seaglass:C.slate)},w.label+(w.best?" \u00b7 best inshore vis":"")+(w.past?" \u00b7 passed":"")));wl.appendChild(row);});wc.appendChild(wl);root.appendChild(wc);}

  /* map */
  var mc=el("div",{class:"card"});var mr=el("div",{class:"row"});mr.appendChild(el("div",{class:"eyebrow"},"Satellite \u00b7 MPA boundaries & access"));
  mr.appendChild(el("button",{style:"font-family:"+MONO+";font-size:10px;color:"+C.slate+";letter-spacing:.1em;background:none;border:none;cursor:pointer;",onClick:function(){if(mapApi)mapApi.fitAll();}},"\u2922 FIT ALL SPOTS"));mc.appendChild(mr);
  mapApi=makeMap();mc.appendChild(mapApi.node);
  var lg=el("div",{class:"legend"});
  lg.appendChild(el("span",{style:"color:"+C.red},"\u25a7 SMR \u00b7 no take"));lg.appendChild(el("span",{style:"color:"+C.amber},"\u25a7 SMCA \u00b7 restricted"));
  lg.appendChild(el("span",{style:"color:"+C.seaglass},"\u25cf dive spot"));lg.appendChild(el("span",{style:"color:"+C.bone},"\u25c6 access"));mc.appendChild(lg);
  mc.appendChild(el("div",{class:"disc"},"Drag to pan \u00b7 pinch or \u00b1 to zoom. Boundaries from CDFW coordinates (CCR Title 14 \u00a7632); access points approximate. Imagery \u00a9 Esri, Maxar, Earthstar Geographics. Verify boundaries on the water."));
  root.appendChild(mc);
  requestAnimationFrame(function(){if(mapApi)mapApi.render();});

  /* spots */
  var sp=el("div",{style:"margin-top:16px;"});sp.appendChild(el("div",{class:"eyebrow"},"Your spots \u00b7 all in open water"));
  SPOTS.forEach(function(s,i){var card=el("div",{class:"spot"});var h=el("div",{class:"row"});var nm=el("div",{class:"h"});nm.innerHTML="<span style='color:"+C.seaglass+"'>"+(i+1)+"</span> \u00b7 "+s.name;h.appendChild(nm);h.appendChild(el("div",{class:"d"},s.depth));card.appendChild(h);card.appendChild(el("div",{class:"n"},s.note));sp.appendChild(card);});root.appendChild(sp);

  /* footer */
  var cov=tideCoverageEnd();
  document.getElementById("foot").textContent="TIDES: NOAA HARMONIC DATA THROUGH "+(cov?cov.toLocaleDateString("en-US",{month:"short",day:"numeric"}).toUpperCase():"\u2014")+" \u00b7 LIVE: "+(d.source?d.source.toUpperCase():(pending?"\u2026":"UNAVAILABLE"))+"  \u2022  VERIFY TIDES BEFORE DIVING \u00b7 CHECK MPA BOUNDARIES";
}

var liveState={status:"loading",data:null};
function loadLive(){liveState={status:"loading",data:null};renderVerdict(liveState);renderContent(liveState);
  fetchLive().then(function(d){liveState={status:"ok",data:d};renderVerdict(liveState);renderContent(liveState);})
  .catch(function(){liveState={status:"failed",data:null};renderVerdict(liveState);renderContent(liveState);});}
document.getElementById("refresh").addEventListener("click",loadLive);
window.addEventListener("resize",function(){if(mapApi)mapApi.render();});
loadLive();
</script>
</body>

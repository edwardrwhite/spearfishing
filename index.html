<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A1D20">
<title>SD Dive Conditions</title>
<style>
  :root{
    --abyss:#0A1D20; --panel:#102B2C; --edge:#1C4140; --seaglass:#6FD3BC;
    --bone:#E9E4D6; --slate:#7FA09B; --amber:#E2A75B; --red:#D97362;
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,monospace;
    --sans:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--abyss);}
  body{font-family:var(--sans);color:var(--bone);
    padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 24px) env(safe-area-inset-left);}
  .wrap{max-width:680px;margin:0 auto;padding:22px 16px 0;}
  .eyebrow{font-family:var(--mono);color:var(--slate);font-size:10px;letter-spacing:.18em;text-transform:uppercase;}
  .card{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:16px;margin-top:16px;}
  h1{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:-.01em;margin:4px 0 0;}
  .btn{background:var(--panel);border:1px solid var(--edge);color:var(--slate);font-family:var(--mono);
    font-size:11px;letter-spacing:.1em;padding:7px 11px;border-radius:6px;cursor:pointer;}
  .row{display:flex;align-items:flex-end;justify-content:space-between;}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px;}
  @media(min-width:520px){.grid{grid-template-columns:repeat(3,1fr);}}
  .tile{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:12px;}
  .tile .v{font-family:var(--mono);font-size:26px;color:var(--bone);font-weight:600;}
  .tile .u{font-family:var(--mono);font-size:12px;color:var(--slate);margin-left:4px;}
  .tile .s{font-size:12px;color:var(--slate);margin-top:2px;}
  .pulse{animation:p 1.4s ease-in-out infinite;} @keyframes p{0%,100%{opacity:1}50%{opacity:.4}}
  .spot{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:12px;margin-top:12px;}
  .spot .h{font-family:var(--mono);font-size:14px;font-weight:700;}
  .spot .d{font-family:var(--mono);font-size:11px;color:var(--slate);}
  .spot .n{font-size:13px;color:var(--slate);line-height:1.5;margin-top:4px;}
  .legend{display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:center;margin-top:12px;}
  .legend span{font-family:var(--mono);font-size:10px;}
  .disc{font-size:11px;color:var(--slate);line-height:1.45;text-align:center;margin-top:8px;}
  #map{position:relative;overflow:hidden;border-radius:8px;height:460px;margin-top:12px;
    touch-action:none;cursor:grab;background:#0C2225;user-select:none;}
  #map img{position:absolute;width:256px;height:256px;user-select:none;-webkit-user-drag:none;}
  #ovl{position:absolute;left:0;top:0;pointer-events:none;}
  .mctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;}
  .mctl button{width:34px;height:34px;background:rgba(10,29,32,.82);border:1px solid var(--edge);
    color:var(--bone);font-family:var(--mono);font-size:17px;border-radius:6px;cursor:pointer;}
  #bmaps{position:absolute;left:8px;top:8px;display:inline-flex;border:1px solid var(--edge);border-radius:7px;overflow:hidden;background:rgba(10,29,32,.85);}
  #bmaps .bm{height:28px;padding:0 9px;background:transparent;border:0;border-right:1px solid var(--edge);
    font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;cursor:pointer;color:var(--slate);}
  #bmaps .bm:last-child{border-right:0;}
  #bmaps .bm.on{color:var(--abyss);background:var(--seaglass);}
  #overlays{position:absolute;left:8px;top:44px;display:inline-flex;gap:6px;}
  #overlays .ov{height:28px;padding:0 10px;background:rgba(10,29,32,.85);border:1px solid var(--edge);
    font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;border-radius:7px;cursor:pointer;color:var(--slate);}
  #overlays .ov.on{color:var(--seaglass);border-color:var(--seaglass);}
  #wqpop{position:absolute;z-index:30;background:rgba(10,29,32,.96);border:1px solid var(--edge);border-radius:8px;
    padding:8px 10px;max-width:180px;box-shadow:0 4px 16px rgba(0,0,0,.5);}
  #wqpop a{text-decoration:underline;}
  #wqlegend{position:absolute;right:8px;bottom:10px;background:rgba(10,29,32,.85);border:1px solid var(--edge);
    border-radius:6px;padding:6px 8px;display:none;flex-direction:column;gap:3px;}
  .tseg{display:inline-flex;border:1px solid var(--edge);border-radius:6px;overflow:hidden;}
  .tseg .tsegb{padding:3px 9px;background:transparent;border:0;border-right:1px solid var(--edge);font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--slate);cursor:pointer;}
  .tseg .tsegb:last-child{border-right:0;}
  .tseg .tsegb.on{color:var(--abyss);background:var(--seaglass);}
  #badge{position:absolute;left:8px;bottom:8px;background:rgba(10,29,32,.85);border:1px solid var(--edge);
    color:var(--amber);font-family:var(--mono);font-size:10px;padding:5px 8px;border-radius:6px;display:none;}
  .foot{font-family:var(--mono);font-size:10px;color:var(--slate);letter-spacing:.1em;line-height:1.8;text-align:center;margin-top:24px;}
</style>
</head>

function computeSunTimes(date, lat, lon) {
  const rad = Math.PI / 180;
  const start = new Date(date.getFullYear(), 0, 0);
  const doy = Math.floor((date - start) / 86400000);
  const lngHour = lon / 15;
  const calc = (rising) => {
    const t = doy + ((rising ? 6 : 18) - lngHour) / 24;
    const M = 0.9856 * t - 3.289;
    let L = M + 1.916 * Math.sin(M * rad) + 0.020 * Math.sin(2 * M * rad) + 282.634;
    L = ((L % 360) + 360) % 360;
    let RA = Math.atan(0.91764 * Math.tan(L * rad)) / rad;
    RA = ((RA % 360) + 360) % 360;
    RA += Math.floor(L / 90) * 90 - Math.floor(RA / 90) * 90;
    RA /= 15;
    const sinDec = 0.39782 * Math.sin(L * rad);
    const cosDec = Math.cos(Math.asin(sinDec));
    const cosH = (Math.cos(90.833 * rad) - sinDec * Math.sin(lat * rad)) / (cosDec * Math.cos(lat * rad));
    if (cosH > 1 || cosH < -1) return null;
    const H = (rising ? 360 - Math.acos(cosH) / rad : Math.acos(cosH) / rad) / 15;
    const T = H + RA - 0.06571 * t - 6.622;
    const UT = ((T - lngHour) % 24 + 24) % 24;
    const evt = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) + UT * 3600000);
    return evt.getHours() * 60 + evt.getMinutes();
  };
  const toHHMM = (m) => (m == null ? null : `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`);
  return { sunrise: toHHMM(calc(true)), sunset: toHHMM(calc(false)) };
}

function el(tag,attrs,kids){var e=document.createElement(tag);if(attrs)for(var k in attrs){if(k==="style")e.style.cssText=attrs[k];else if(k==="class")e.className=attrs[k];else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2).toLowerCase(),attrs[k]);else e.setAttribute(k,attrs[k]);}if(kids!=null)(Array.isArray(kids)?kids:[kids]).forEach(function(c){e.appendChild(typeof c==="string"?document.createTextNode(c):c);});return e;}
function svgEl(tag,attrs,kids){var e=document.createElementNS("http://www.w3.org/2000/svg",tag);if(attrs)for(var k in attrs)e.setAttribute(k,attrs[k]);if(kids!=null)(Array.isArray(kids)?kids:[kids]).forEach(function(c){e.appendChild(typeof c==="string"?document.createTextNode(c):c);});return e;}

/* ===== tide chart ===== */
var tideView=1;
function tideChart(ext,nowM,sunriseM,sunsetM,viewDays){
  viewDays=viewDays||1;var multi=viewDays>1;
  var W=620,H=multi?215:198,padL=34,padB=multi?30:22,padT=20,iw=W-padL-8,ih=H-padB-padT;
  var startM=0,endM=viewDays*1440,step=viewDays<=1?10:viewDays<=3?20:30;
  var pts=[];for(var m=startM;m<=endM;m+=step){var h=tideHeightAt(m,ext);if(h!=null)pts.push([m,h]);}
  if(pts.length<4)return el("div",{style:"height:190px;display:flex;align-items:center;justify-content:center;color:"+C.slate+";font-family:"+MONO+";font-size:12px;"},"Tide data unavailable");
  var hs=pts.map(function(p){return p[1];}),hmin=Math.min.apply(null,hs)-0.4,hmax=Math.max.apply(null,hs)+0.5;
  var X=function(m){return padL+(m-startM)/(endM-startM)*iw;},Y=function(h){return padT+(1-(h-hmin)/(hmax-hmin))*ih;};
  var d="M"+pts.map(function(p){return X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1);}).join(" L");
  var area=d+" L"+X(endM).toFixed(1)+","+(padT+ih)+" L"+X(startM).toFixed(1)+","+(padT+ih)+" Z";
  var g=svgEl("svg",{viewBox:"0 0 "+W+" "+H,style:"width:100%;height:"+H+"px;"});
  var defs=svgEl("defs");var lg=svgEl("linearGradient",{id:"tf",x1:"0",y1:"0",x2:"0",y2:"1"});
  lg.appendChild(svgEl("stop",{offset:"0%","stop-color":C.seaglass,"stop-opacity":"0.32"}));
  lg.appendChild(svgEl("stop",{offset:"100%","stop-color":C.seaglass,"stop-opacity":"0.02"}));defs.appendChild(lg);g.appendChild(defs);
  var pn=pacNow(),DOW=["SUN","MON","TUE","WED","THU","FRI","SAT"];
  if(!multi){
    [0,360,720,1080,1440].forEach(function(t){g.appendChild(svgEl("line",{x1:X(t),y1:padT,x2:X(t),y2:padT+ih,stroke:C.edge,"stroke-dasharray":"2 6"}));
      g.appendChild(svgEl("text",{x:X(t),y:H-7,fill:C.slate,"font-family":MONO,"font-size":"10","text-anchor":"middle"},fmtMins(t)));});
  }else{
    for(var dd=0;dd<=viewDays;dd++){var mx=dd*1440;g.appendChild(svgEl("line",{x1:X(mx),y1:padT,x2:X(mx),y2:padT+ih,stroke:C.edge,"stroke-opacity":(dd===0||dd===viewDays)?"0.9":"0.55","stroke-width":"1"}));
      if(dd<viewDays){var dt=new Date(pn.y,pn.mo-1,pn.d+dd),lbl=dd===0?"TODAY":DOW[dt.getDay()];
        g.appendChild(svgEl("text",{x:X(mx+720),y:H-9,fill:C.slate,"font-family":MONO,"font-size":"9.5","text-anchor":"middle","letter-spacing":"0.06em"},lbl));}}
  }
  [hmin,(hmin+hmax)/2,hmax].forEach(function(h){g.appendChild(svgEl("text",{x:padL-5,y:Y(h)+3,fill:C.slate,"font-family":MONO,"font-size":"10","text-anchor":"end"},h.toFixed(1)));});
  if(!multi){[sunriseM,sunsetM].forEach(function(sm){if(sm!=null)g.appendChild(svgEl("line",{x1:X(sm),y1:padT,x2:X(sm),y2:padT+ih,stroke:C.slate,"stroke-dasharray":"3 3","stroke-opacity":"0.65"}));});}
  g.appendChild(svgEl("path",{d:area,fill:"url(#tf)"}));
  g.appendChild(svgEl("path",{d:d,fill:"none",stroke:C.seaglass,"stroke-width":multi?"1.6":"2"}));
  if(nowM>=startM&&nowM<=endM){g.appendChild(svgEl("line",{x1:X(nowM),y1:padT,x2:X(nowM),y2:padT+ih,stroke:C.amber,"stroke-width":"1.5"}));
    var ch=tideHeightAt(nowM,ext);if(ch!=null)g.appendChild(svgEl("circle",{cx:X(nowM),cy:Y(ch),r:"4",fill:C.amber,stroke:C.abyss,"stroke-width":"1.5"}));}
  function lab(x,y,txt,col){g.appendChild(svgEl("text",{x:x,y:y,"text-anchor":"middle",fill:col,"font-family":MONO,"font-size":multi?"8.5":"9.5","font-weight":"700","paint-order":"stroke",stroke:"rgba(10,29,32,0.92)","stroke-width":"3"},txt));}
  ext.forEach(function(e){
    if(e.m<startM-2||e.m>endM+2)return;
    var x=X(Math.max(startM,Math.min(endM,e.m))),y=Y(e.h),col=e.type==="H"?C.seaglass:C.amber;
    g.appendChild(svgEl("circle",{cx:x,cy:y,r:multi?"2.6":"3.2",fill:col,stroke:C.abyss,"stroke-width":"1"}));
    if(viewDays<=1){
      var above=e.type==="H",y1=above?y-16:y+15,y2=above?y-6:y+25;
      if(y1<6){above=false;y1=y+15;y2=y+25;}
      if(y2>padT+ih+16){above=true;y1=y-16;y2=y-6;}
      var ax=x;if(ax<padL+24)ax=padL+24;if(ax>W-24)ax=W-24;
      lab(ax,y1,e.type+" "+e.h.toFixed(1)+"ft",col);
      lab(ax,y2,fmtMins(e.m),C.slate);
    }else if(viewDays<=3){
      lab(x,e.type==="H"?y-6:y+12,e.h.toFixed(1),col);
    }
  });
  return g;
}
function buildTideCard(nowM,srM,ssM){
  var card=el("div",{class:"card"});
  var hdr=el("div",{class:"row",style:"align-items:center;"});
  var left=el("div",{style:"display:flex;align-items:center;gap:10px;flex-wrap:wrap;"});
  left.appendChild(el("div",{class:"eyebrow"},"Tide"));
  var seg=el("div",{class:"tseg"}),vbtn={};
  [[1,"TODAY"],[3,"3-DAY"],[7,"7-DAY"]].forEach(function(v){
    var b=el("button",{class:"tsegb"+(v[0]===tideView?" on":""),onClick:function(){tideView=v[0];for(var k in vbtn)vbtn[k].className="tsegb"+(+k===tideView?" on":"");refresh();}},v[1]);
    vbtn[v[0]]=b;seg.appendChild(b);});
  left.appendChild(seg);hdr.appendChild(left);
  var ext1=getTideExtremes(1,1),curH=tideHeightAt(nowM,ext1),nextE=ext1.find(function(e){return e.m>nowM;}),trend=(nextE&&curH!=null)?(nextE.h>curH?"rising":"falling"):null;
  if(curH!=null){var rt=el("div",{style:"font-family:"+MONO+";font-size:12px;color:"+C.bone});rt.innerHTML="now <b style='color:"+C.seaglass+"'>"+curH.toFixed(1)+" ft</b>"+(trend?" <span style='color:"+C.slate+"'>\u00b7 "+trend+" "+(trend==="rising"?"\u2197":"\u2198")+"</span>":"");hdr.appendChild(rt);}
  card.appendChild(hdr);
  var body=el("div",{style:"margin-top:2px;"});card.appendChild(body);
  function refresh(){body.innerHTML="";var ext=getTideExtremes(1,tideView+1);body.appendChild(tideChart(ext,nowM,srM,ssM,tideView));}
  refresh();return card;
}

  if(live.status==="loading"){var c=el("div",{class:"card pulse",style:"display:flex;align-items:center;gap:12px;"});c.appendChild(el("div",{style:"width:8px;height:8px;border-radius:50%;background:"+C.seaglass}));c.appendChild(el("span",{style:"font-family:"+MONO+";font-size:11px;color:"+C.slate+";letter-spacing:.12em;text-transform:uppercase;"},"Reading buoys for swell & wind\u2026"));box.appendChild(c);return;}
  if(live.status==="failed"){var c2=el("div",{class:"card",style:"border-color:"+C.amber+"55;"});c2.appendChild(el("div",{style:"font-family:"+MONO+";font-size:11px;color:"+C.amber+";letter-spacing:.1em;text-transform:uppercase;"},"Live swell & wind unavailable"));c2.appendChild(el("div",{style:"font-size:13px;color:"+C.slate+";line-height:1.45;margin-top:4px;"},"Tides, sun and the map work without a connection \u2014 plan around the windows below and read the water on arrival."));box.appendChild(c2);return;}
  var r=scoreConditions(live.data);if(!r)return;
  var c3=el("div",{class:"card",style:"border-color:"+r.color+"55;display:flex;align-items:center;gap:16px;"});
  var ring=el("div",{style:"width:64px;height:64px;border-radius:50%;border:2px solid "+r.color+";display:flex;align-items:center;justify-content:center;flex:0 0 auto;"});
  ring.appendChild(el("span",{style:"font-family:"+MONO+";font-size:22px;font-weight:700;color:"+r.color},String(r.score)));c3.appendChild(ring);
  var txt=el("div");txt.appendChild(el("div",{style:"color:"+r.color+";font-family:"+MONO+";font-size:15px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;"},r.label));
  if(live.data.summary)txt.appendChild(el("div",{style:"color:"+C.slate+";font-size:13px;line-height:1.45;margin-top:4px;"},live.data.summary));c3.appendChild(txt);box.appendChild(c3);
}
function renderContent(live){
  var root=document.getElementById("content");root.innerHTML="";
  var ext=getTideExtremes(),nowM=pacNow().min;
  var st=sunTimes(),srM=st.sunriseM,ssM=st.sunsetM;
  var curH=tideHeightAt(nowM,ext),nextE=ext.find(function(e){return e.m>nowM;}),trend=nextE&&curH!=null?(nextE.h>curH?"rising":"falling"):null;
  var today=ext.filter(function(e){return e.m>=0&&e.m<=1440;});

  /* tide card */
  root.appendChild(buildTideCard(nowM,srM,ssM));

  /* tiles */
  var pending=live.status==="loading",d=live.data||{},vis=d.visibility||{};
  var grid=el("div",{class:"grid"});
  grid.appendChild(tile("Visibility est.",vis.lowFt!=null?vis.lowFt+"\u2013"+(vis.highFt==null?"?":vis.highFt):null,"ft",vis.note,pending));
  grid.appendChild(tile("Swell",d.swell?d.swell.heightFt:null,"ft",d.swell?((d.swell.periodS==null?"?":d.swell.periodS)+"s \u00b7 "+(d.swell.direction||"")):null,pending));
  grid.appendChild(tile("Wind",d.wind?d.wind.speedKt:null,"kt",d.wind?d.wind.direction:null,pending));
  grid.appendChild(tile("Water temp",d.waterTempF,"\u00b0F",d.waterTempF!=null?((d.waterTempF>=66?"Yellowtail water":d.waterTempF>=62?"5mm comfortable":"Cold \u2014 full kit")+(d.waterTempSrc?" \u00b7 "+d.waterTempSrc:"")):null,pending));
  grid.appendChild(tile("First light",srM!=null?fmtMins(srM):null,null,"sunrise",false));
  grid.appendChild(tile("Last light",ssM!=null?fmtMins(ssM):null,null,"sunset",false));
  root.appendChild(grid);

  /* dive windows */
  var wins=today.filter(function(e){return srM!=null&&ssM!=null&&e.m>srM-30&&e.m<ssM+30;}).map(function(e){return {from:e.m-60,to:e.m+60,label:e.type==="H"?"High slack":"Low slack",past:e.m+60<nowM,best:e.type==="H"};});
  if(wins.length){var wc=el("div",{class:"card"});wc.appendChild(el("div",{class:"eyebrow"},"Dive windows \u00b7 slack tide in daylight"));var wl=el("div",{style:"display:flex;flex-direction:column;gap:6px;margin-top:8px;"});
    wins.forEach(function(w){var row=el("div",{style:"display:flex;align-items:center;gap:12px;"+(w.past?"opacity:.45;":"")});row.appendChild(el("span",{style:"font-family:"+MONO+";font-size:13px;color:"+C.bone+";min-width:118px;"},fmtMins(w.from)+"\u2013"+fmtMins(w.to)));
      row.appendChild(el("span",{style:"font-family:"+MONO+";font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:"+(w.best?C.seaglass:C.slate)},w.label+(w.best?" \u00b7 best inshore vis":"")+(w.past?" \u00b7 passed":"")));wl.appendChild(row);});wc.appendChild(wl);root.appendChild(wc);}

  /* map */
  var mc=el("div",{class:"card"});var mr=el("div",{class:"row"});mr.appendChild(el("div",{class:"eyebrow"},"Satellite \u00b7 MPA boundaries & access"));
  mr.appendChild(el("button",{style:"font-family:"+MONO+";font-size:10px;color:"+C.slate+";letter-spacing:.1em;background:none;border:none;cursor:pointer;",onClick:function(){if(mapApi)mapApi.fitAll();}},"\u2922 FIT ALL SPOTS"));mc.appendChild(mr);
  mapApi=makeMap();mc.appendChild(mapApi.node);
  var lg=el("div",{class:"legend"});
  lg.appendChild(el("span",{style:"color:"+C.red},"\u25a7 SMR \u00b7 no take"));lg.appendChild(el("span",{style:"color:"+C.amber},"\u25a7 SMCA \u00b7 restricted"));
  lg.appendChild(el("span",{style:"color:"+C.seaglass},"\u25cf dive spot"));lg.appendChild(el("span",{style:"color:"+C.bone},"\u25c6 access"));mc.appendChild(lg);
  var kl=el("div",{style:"display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap;"});
  kl.appendChild(el("span",{style:"font-family:"+MONO+";font-size:10px;color:"+C.slate},"KELP CANOPY"));
  kl.appendChild(el("span",{style:"width:90px;height:9px;border-radius:2px;background:linear-gradient(90deg,"+KELP_STOPS+");"}));
  kl.appendChild(el("span",{style:"font-family:"+MONO+";font-size:10px;color:"+C.slate},"low\u2192high %"));
  kl.appendChild(el("span",{style:"width:12px;height:9px;border-radius:2px;background:#D0D0D0;margin-left:6px;"}));
  kl.appendChild(el("span",{style:"font-family:"+MONO+";font-size:10px;color:"+C.slate},"historic (now bare)"));
  mc.appendChild(kl);
  mc.appendChild(el("div",{class:"disc"},"Drag to pan \u00b7 pinch or \u00b1 to zoom. Toggle the kelp layer with the KELP button ("+KELP_DATE+"; Point Loma, La Jolla & Encinitas\u2013Solana). Boundaries from CDFW coordinates (CCR Title 14 \u00a7632); access points approximate. Imagery \u00a9 Esri, Maxar, Earthstar Geographics. Verify boundaries on the water."));
  root.appendChild(mc);
  requestAnimationFrame(function(){if(mapApi)mapApi.render();});

  /* spots */
  var sp=el("div",{style:"margin-top:16px;"});sp.appendChild(el("div",{class:"eyebrow"},"Your spots \u00b7 all in open water"));
  SPOTS.forEach(function(s,i){var card=el("div",{class:"spot"});var h=el("div",{class:"row"});var nm=el("div",{class:"h"});nm.innerHTML="<span style='color:"+C.seaglass+"'>"+(i+1)+"</span> \u00b7 "+s.name;h.appendChild(nm);h.appendChild(el("div",{class:"d"},s.depth));card.appendChild(h);card.appendChild(el("div",{class:"n"},s.note));sp.appendChild(card);});root.appendChild(sp);

  /* footer */
  var cov=tideCoverageEnd();
  document.getElementById("foot").textContent="TIDES: "+tideSourceLabel()+" THROUGH "+(cov?cov.toLocaleDateString("en-US",{month:"short",day:"numeric"}).toUpperCase():"\u2014")+" \u00b7 LIVE: "+(d.source?d.source.toUpperCase():(pending?"\u2026":"UNAVAILABLE"))+"  \u2022  VERIFY TIDES BEFORE DIVING \u00b7 CHECK MPA BOUNDARIES";
}

var liveState={status:"loading",data:null};
function loadLive(){liveState={status:"loading",data:null};renderVerdict(liveState);renderContent(liveState);
  fetchTides(function(ok){if(ok){renderVerdict(liveState);renderContent(liveState);}});
  fetchLive().then(function(d){liveState={status:"ok",data:d};renderVerdict(liveState);renderContent(liveState);})
  .catch(function(){liveState={status:"failed",data:null};renderVerdict(liveState);renderContent(liveState);});}
document.getElementById("refresh").addEventListener("click",loadLive);
window.addEventListener("resize",function(){if(mapApi)mapApi.render();});
loadTideCache();
loadLive();
</script>
</body>
